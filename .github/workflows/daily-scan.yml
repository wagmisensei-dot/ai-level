# Runs the scanner every day and commits the new data.js, so a GitHub Pages site updates itself.
# Needs one repository secret: ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
name: Daily power-up scan

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily (US morning, Cairo afternoon)
  workflow_dispatch:        # "Run workflow" button for a manual scan

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python scripts/scan.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit new power-ups
        run: |
          git config user.name "power-up-bot"
          git config user.email "power-up-bot@users.noreply.github.com"
          git add data.js data/
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git push
